<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<meta name="description" content="Hood Boss Team Lead Briefing — leadership evaluation theater. Watch the standard, capture answers, compile a record." />
<title>Hood Boss Team Lead Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#05070a;--elev:#0b1016;--surface:#10161e;--fg:#e8edf4;--muted:#8b93a7;--dim:#5b6478;
  --neon:#00ff87;--cyan:#60efff;--hot:#ff0080;--warn:#ffcc00;--line:#1c2530;--line2:#2a3544;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Rajdhani,system-ui,sans-serif;letter-spacing:.02em;margin:0}
.kicker{font:11px/1 "IBM Plex Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--neon)}
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr 64px;height:100dvh}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(11,16,22,.92);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border:1px solid var(--neon);border-radius:8px;display:grid;place-items:center;color:var(--neon);font:700 13px Rajdhani,sans-serif;box-shadow:0 0 18px rgba(0,255,135,.18)}
.brand b{display:block;font:700 15px Rajdhani,sans-serif}
.brand small{color:var(--muted);font-size:11px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes button,.btn{border:1px solid var(--line);background:var(--elev);color:var(--fg);border-radius:999px;padding:8px 12px;min-height:40px;cursor:pointer;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.modes button.on,.btn.primary{border-color:var(--neon);background:rgba(0,255,135,.12);color:var(--neon)}
.btn.primary{background:var(--neon);color:#04140c}
.btn.cyan{border-color:rgba(96,239,255,.4);color:var(--cyan)}
.btn:hover{border-color:var(--cyan)}
.side{border-right:1px solid var(--line);overflow:auto;background:var(--elev);padding:10px 8px}
.nav-item{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-left:3px solid transparent;border-radius:0 8px 8px 0;cursor:pointer}
.nav-item:hover{background:rgba(0,255,135,.06);color:var(--fg)}
.nav-item.on{background:rgba(0,255,135,.12);border-left-color:var(--neon);color:var(--neon)}
.nav-item span{display:block;font:10px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;margin-bottom:3px;opacity:.7}
.stage{position:relative;overflow:hidden}
#viz{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.sheet{position:relative;z-index:2;height:100%;overflow:auto;padding:28px 28px 40px}
.sheet-inner{max-width:760px}
.sheet h1{font-size:clamp(1.8rem,1.1rem + 2.4vw,3.2rem);line-height:1.05;margin:.35rem 0 12px}
.lead{color:var(--muted);line-height:1.55;max-width:62ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.chip{border:1px solid var(--line);background:rgba(16,22,30,.78);border-radius:10px;padding:12px;text-align:left;cursor:pointer;min-height:52px}
.chip.on,.chip:hover{border-color:rgba(0,255,135,.55);background:rgba(0,255,135,.1)}
.chip b{display:block;font:700 13px Rajdhani,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--neon)}
.chip p{margin:4px 0 0;color:var(--muted);font-size:13px}
.field{margin:12px 0}
.field label{display:block;font-size:13px;margin-bottom:6px}
.field textarea,.field input{width:100%;border:1px solid var(--line);background:#070b10;border-radius:10px;padding:10px 12px}
.field textarea{min-height:96px;resize:vertical}
.score{font:12px "IBM Plex Mono",monospace;color:var(--neon);margin-top:4px}
.bar{height:8px;background:#06131e;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:10px 0 18px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--cyan));transition:width .25s}
.foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;border-top:1px solid var(--line);background:rgba(11,16,22,.94)}
.hint{color:var(--dim);font:11px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.panel{position:absolute;inset:12px;z-index:8;overflow:auto;border:1px solid var(--line);border-radius:16px;background:rgba(8,12,18,.94);backdrop-filter:blur(16px);padding:18px;display:none}
.panel.show{display:block}
@media(min-width:860px){.panel{left:auto;width:min(440px,calc(100vw - 2rem));top:16px;bottom:16px;right:16px}}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.source{color:var(--dim);font-size:12px;margin-top:18px}
.hide{display:none!important}
#burger{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:56px auto 64px 0;width:min(280px,86vw);z-index:20;transform:translateX(-105%);transition:transform .22s ease;border-right:1px solid var(--line)}
  .side.open{transform:none}
  #burger{display:inline-flex}
  .grid2{grid-template-columns:1fr}
  .hint{display:none}
  .sheet{padding:20px 16px 32px}
  .modes button{padding:8px 10px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <button class="btn" id="burger" type="button">Menu</button>
      <div class="mark">HB</div>
      <div>
        <b>Team Lead Briefing</b>
        <small>Hood Boss · NEXUS Core</small>
      </div>
    </div>
    <div class="modes">
      <button type="button" data-mode="brief" class="on">Brief</button>
      <button type="button" data-mode="drill">Drill</button>
      <button type="button" data-mode="compile">Compile</button>
    </div>
  </header>
  <aside class="side" id="side"></aside>
  <main class="stage">
    <canvas id="viz"></canvas>
    <div class="sheet"><div class="sheet-inner" id="slide"></div></div>
    <section class="panel" id="compilePanel"></section>
  </main>
  <footer class="foot">
    <button class="btn" type="button" id="prev">Back</button>
    <div class="hint">Arrows · Space · D drill · C compile</div>
    <div class="kicker" id="pos">01 / 14</div>
    <button class="btn primary" type="button" id="next">Next</button>
  </footer>
</div>
<script>
(function () {
  var LIVE_OS = "https://hb-team-leader.netlify.app/";
  var KEY = "hb-tl-briefing-gh-v1";
  var CHAPTERS = [
    {id:"open",kicker:"TEAM LEAD  ·  BRIEFING",title:"This is not a job title.",statement:"It is the standard you carry when nobody is standing over you. Candidates are not watching a policy lecture. They are entering a leadership evaluation.",source:"v1 Hood Boss professional layer · NEXUS Core signature"},
    {id:"mission",kicker:"MISSION BRIEF",title:"The Team Lead is the site standard.",statement:"Managers of assigned technicians and vehicles. Lead site representative. Responsible for successful execution to company standards. The interview is not asking if you want more money. It is asking if the company can trust you with the job, the crew, the truck, and the customer.",source:"Team Lead packet / job description, pages 7–11"},
    {id:"roadmap",kicker:"INTERVIEW ROADMAP",title:"Four rounds. One question underneath.",statement:"Every section tests whether the candidate can lead without hiding, guessing, blaming, or drifting. Underneath every question: can you explain your thinking, own the outcome, and move the crew forward?",source:"Team Lead Interview Questions, pages 3–4"},
    {id:"experience",kicker:"ROUND 1  ·  EXPERIENCE",title:"Experience is not years. It is what you learned.",statement:"What did you learn from people you worked with? How could the Team Lead role improve? What leadership have you already shown? Say what you observed from strong and weak examples. Explain the process, not just the complaint. Show where you already helped someone else get better.",source:"Experience questions, page 3"},
    {id:"performance",kicker:"ROUND 2  ·  PERFORMANCE",title:"The hard-story question matters most.",statement:"Tell me about a time you ran into trouble or had significant difficulty at a customer location. Where was it? Who were you with? What happened? What did you do? What did you learn? The company is listening for calm problem-solving under pressure — not a career with nothing wrong.",source:"Performance section, page 4"},
    {id:"comms",kicker:"ROUND 3  ·  COMMUNICATION",title:"Communication is the control system.",statement:"A Team Lead does not disappear into the job. They keep the job visible. Arrival, issues, photos, closeout. Control Tower has to know you are there, what blocks the work, how to verify before/after, and how to approve the outcome.",source:"Communication Evaluation, page 4; CT options, pages 8–9"},
    {id:"workflow",kicker:"WORKFLOW",title:"The job has a rhythm.",statement:"On the Way. On Site. Waiting on Access. Check In. Check Out. Needs SM Review. Skipping a step causes confusion, bad documentation, and weak closeout. Status is not paperwork. Status tells the company where the job is alive.",source:"Workflow for Work Orders [Technicians], page 5"},
    {id:"prep",kicker:"FIELD OPS",title:"Prepare before the mess starts.",statement:"Review the assignment, special instructions, materials, liquids, required equipment, and crew clock-in before the truck moves. Preparation is a leadership behavior: reduce preventable failure before it reaches the customer site.",source:"Additional Team Lead responsibilities, page 8"},
    {id:"evidence",kicker:"DOCUMENTATION",title:"Before/after photos are evidence.",statement:"Notes, timestamps, before/after photos, deficiencies, and site challenges. Before shows the starting condition. During captures issues and blockers. After proves the completed outcome. If it is not visible, it is hard to defend.",source:"Documentation duties, pages 7–8"},
    {id:"command",kicker:"PEOPLE LEADERSHIP",title:"Coach without losing the standard.",statement:"Communication, decision-making, independence, coaching, team development, professionalism, and safety correction. Great leadership is not being the loudest person on the crew. It is keeping the job safe, clean, documented, and moving.",source:"Qualifications and coaching requirements, pages 10–11"},
    {id:"signal",kicker:"CANDIDATE GUIDANCE",title:"The interview rewards ownership.",statement:"A strong answer does not sound perfect. It sounds clear, specific, and accountable. Weak: that was not my fault. Better: here is what happened. Strong: here is what I did, what I learned, and what I would do next time.",source:"Full interview guide, pages 3–4"},
    {id:"gates",kicker:"FINAL GATE",title:"Ready does not mean perfect.",statement:"Ready means the evidence is strong enough to trust you with the next level of responsibility. The candidate can still grow. Readiness still needs proof.",source:"Team Lead qualifications, pages 10–11"},
    {id:"compile",kicker:"FROM HANDOUT TO SYSTEM",title:"The briefing becomes a record.",statement:"This theater sets the standard. Drill mode captures answers. Readiness tracks evidence. Field ops proves execution. Compile the payload, then open Team Lead OS to keep the file alive.",source:"Deck built from uploaded Team Lead packet · live OS"},
    {id:"close",kicker:"CARRY THE STANDARD",title:"The interview is not a trap.",statement:"It is a chance to prove you can think clearly, lead people, communicate honestly, protect the customer, and finish the job right. Leadership selection. Readiness. Field execution.",source:"Hood Boss Team Lead Briefing · NEXUS Core"}
  ];
  var TRUST=[["THE JOB","Execute to company standard. No guessing. No drift."],["THE CREW","They move because you set the pace and the bar."],["THE TRUCK","Equipment, liquids, and setup are ready before wheels roll."],["THE CUSTOMER","The site is represented. The work is visible. The closeout holds."]];
  var ROUNDS=[["experience","01 EXPERIENCE","What did you learn?"],["performance","02 PERFORMANCE","What did you do under pressure?"],["comms","03 COMMUNICATION","Can the job stay visible?"],["command","04 GENERAL","Will you carry the standard?"]];
  var LEARN=[["LEARN","Say what you observed from strong and weak examples."],["IMPROVE","Explain the process, not just the complaint."],["LEAD","Show where you already helped someone else get better."]];
  var STAR=[["where","WHERE","Customer location / site"],["who","WHO","Crew, manager, customer"],["what","WHAT","The trouble, plainly"],["action","ACTION","What you did"],["lesson","LESSON","What you carry forward"]];
  var COMMS=[["arrival","ARRIVAL","Do they know you are there?"],["issues","ISSUES","Do they know what blocks the job?"],["photos","PHOTOS","Can they verify before/after work?"],["closeout","CLOSEOUT","Can they approve the outcome?"]];
  var FLOW=[["way","1 On the Way"],["site","2 On Site"],["access","3 Waiting on Access"],["in","4 Check In"],["out","5 Check Out"],["review","6 Needs SM Review"]];
  var PREP=[["wo","WORK ORDER","Know the assignment before the truck moves."],["eq","EQUIPMENT","Verify tools, materials, liquids, and cleaning setup."],["clock","CREW CLOCK-IN","Assigned crew is clocked in via MyTechPix."]];
  var EV=[["before","BEFORE","Show the starting condition."],["during","DURING","Capture issues and blockers."],["after","AFTER","Prove the completed outcome."]];
  var CMD=[["coach","Coach"],["correct","Correct"],["escalate","Escalate"],["encourage","Encourage"],["own","Own"]];
  var BANDS=[["WEAK","That was not my fault."],["BETTER","Here is what happened."],["STRONG","Here is what I did, what I learned, and what I would do next time."]];
  var GATES=[["kec","90+ days KEC","Experience in the craft"],["senior","Senior crew","Guiding others"],["attendance","Attendance","Shows up reliably"],["docs","Documentation","Protects the company"],["comms","Communication","Keeps the job visible"],["decide","Decision-making","Handles field reality"],["coach","Coaching","Builds the crew"],["pro","Professionalism","Represents Hood Boss"]];
  var QS=[
    ["ex-learn","Experience","What did you learn from people you have worked with — strong and weak?","Specific lesson + honest example + how you would apply it."],
    ["ex-improve","Experience","How could the Team Lead role improve on the sites you have seen?","Process, not just complaint. A change you would actually run."],
    ["ex-lead","Experience","Where have you already helped someone else get better?","Leadership without the title. Coaching in the moment."],
    ["perf-hard","Performance","Tell me about a time you ran into trouble or had significant difficulty at a customer location.","WHERE / WHO / WHAT / ACTION / LESSON. Calm ownership under pressure."],
    ["cm-tower","Communication","What is the value of Control Tower on a live job?","Visibility: arrival, blockers, photos, closeout. Not radio theater."],
    ["cm-habit","Communication","How do you stay in contact when the job gets ugly?","Spoken and written. Photos that can be verified. No disappearing."],
    ["gn-standard","General","When nobody is standing over you, what standard do you carry?","Safety, cleanliness, documentation, forward motion. Not volume."]
  ];

  function empty() {
    var s = {candidate:"",site:"",answers:{},star:{},gates:{},comms:{},prep:{},evidence:{},command:{},scores:{},notes:"",startedAt:Date.now()};
    STAR.forEach(function(x){s.star[x[0]]="";});
    GATES.forEach(function(x){s.gates[x[0]]=false;});
    COMMS.forEach(function(x){s.comms[x[0]]=false;});
    PREP.forEach(function(x){s.prep[x[0]]=false;});
    EV.forEach(function(x){s.evidence[x[0]]=false;});
    CMD.forEach(function(x){s.command[x[0]]=false;});
    return s;
  }
  function load() {
    try { return Object.assign(empty(), JSON.parse(localStorage.getItem(KEY)||"{}")); }
    catch(e){ return empty(); }
  }
  function save(){ localStorage.setItem(KEY, JSON.stringify(state.session)); }
  function scoreAnswer(text){
    var t=String(text||"").toLowerCase(), s=32, words=t.trim().split(/\s+/).filter(Boolean);
    if(words.length>18) s+=10;
    if(words.length>42) s+=6;
    if(/\b(i|we)\b/.test(t) && /\b(did|called|fixed|stopped|owned|told|showed|documented|photos?)\b/.test(t)) s+=18;
    if(/\b(learned|next time|would|from now|so i)\b/.test(t)) s+=14;
    if(/\b(because|so that|which meant)\b/.test(t)) s+=8;
    if(/\b(where|who|what)\b/.test(t)) s+=6;
    if(/\b(not my fault|they didn't|wasn't me|nobody told)\b/.test(t)) s-=28;
    if(/\b(always|never|perfect)\b/.test(t) && words.length<20) s-=8;
    return Math.max(0, Math.min(100, Math.round(s)));
  }
  function band(n){ return n>=70?"STRONG":n>=45?"BETTER":"WEAK"; }
  function readiness(){
    var g=GATES.filter(function(x){return state.session.gates[x[0]];}).length/GATES.length;
    var scores=Object.keys(state.session.scores).map(function(k){return state.session.scores[k];});
    var ans=scores.length?scores.reduce(function(a,b){return a+b;},0)/scores.length/100:0;
    var vis=COMMS.filter(function(x){return state.session.comms[x[0]];}).length/COMMS.length;
    return g*0.55+ans*0.3+vis*0.15;
  }
  function esc(s){
    return String(s||"").replace(/[&<>"']/g, function(ch){
      if (ch === "&") return "\u0026amp;";
      if (ch === "<") return "\u0026lt;";
      if (ch === ">") return "\u0026gt;";
      if (ch === '"') return "\u0026quot;";
      return "\u0026#39;";
    });
  }

  var state = { chapter:"open", mode:"brief", session:load() };
  var hash = (location.hash||"").replace("#","");
  if (CHAPTERS.some(function(c){return c.id===hash;})) state.chapter = hash;

  function setChapter(id){
    state.chapter=id;
    history.replaceState(null,"", "#"+id);
    render();
  }
  function idx(){ return CHAPTERS.findIndex(function(c){return c.id===state.chapter;}); }
  function go(d){ var i=Math.max(0,Math.min(CHAPTERS.length-1, idx()+d)); setChapter(CHAPTERS[i].id); }

  function chips(rows, on){
    return '<div class="grid2">'+rows.map(function(r){
      var active = on && on(r);
      return '<button type="button" class="chip'+(active?" on":"")+'" data-chip="'+esc(r[0])+'"><b>'+esc(r[1]||r[0])+'</b><p>'+esc(r[2]||"")+'</p></button>';
    }).join("")+"</div>";
  }
  function fieldsFor(round){
    if(state.mode!=="drill") return "";
    return QS.filter(function(q){return q[1]===round;}).map(function(q){
      var v=state.session.answers[q[0]]||"";
      var sc=state.session.scores[q[0]];
      return '<div class="field"><label>'+esc(q[2])+'<div class="source">Listen for: '+esc(q[3])+'</div></label><textarea data-ans="'+q[0]+'">'+esc(v)+'</textarea>'+(sc!=null?'<div class="score">'+sc+' · '+band(sc)+'</div>':'')+'</div>';
    }).join("");
  }

  function bodyFor(c){
    var html = '<p class="lead">'+esc(c.statement)+'</p>';
    if(c.id==="open"){
      html = '<p class="lead">Candidates are not watching a policy lecture. They are entering a leadership evaluation. Capture answers. Compile a record. Then open Team Lead OS.</p>'+
        '<div class="actions"><button class="btn primary" type="button" id="enter">Enter briefing</button><button class="btn cyan" type="button" data-mode="drill">Run drill</button></div>';
    }
    if(c.id==="mission") html += chips(TRUST.map(function(t){return [t[0],t[0],t[1]];}));
    if(c.id==="roadmap") html += chips(ROUNDS.map(function(r){return [r[0],r[1],r[2]];}));
    if(c.id==="experience"){ html += chips(LEARN.map(function(x){return [x[0],x[0],x[1]];})) + fieldsFor("Experience"); }
    if(c.id==="performance"){
      html += '<div class="grid2">'+STAR.map(function(s){
        return '<div class="field"><label>'+esc(s[1])+' · '+esc(s[2])+'</label><input data-star="'+s[0]+'" value="'+esc(state.session.star[s[0]]||"")+'" /></div>';
      }).join("")+'</div>'+fieldsFor("Performance");
    }
    if(c.id==="comms") html += chips(COMMS.map(function(x){return [x[0],x[1],x[2]];}), function(r){return state.session.comms[r[0]];}) + fieldsFor("Communication");
    if(c.id==="workflow") html += chips(FLOW.map(function(x){return [x[0],x[1],"Keep the office from guessing."];}));
    if(c.id==="prep") html += chips(PREP.map(function(x){return [x[0],x[1],x[2]];}), function(r){return state.session.prep[r[0]];});
    if(c.id==="evidence") html += chips(EV.map(function(x){return [x[0],x[1],x[2]];}), function(r){return state.session.evidence[r[0]];});
    if(c.id==="command") html += chips(CMD.map(function(x){return [x[0],x[1],""];}), function(r){return state.session.command[r[0]];}) + fieldsFor("General");
    if(c.id==="signal") html += chips(BANDS.map(function(x){return [x[0],x[0],x[1]];}));
    if(c.id==="gates"){
      html += chips(GATES.map(function(x){return [x[0],x[1],x[2]];}), function(r){return state.session.gates[r[0]];});
      var r=Math.round(readiness()*100);
      html += '<div class="kicker" style="margin-top:12px">Readiness</div><div class="bar"><i style="width:'+r+'%"></i></div><p class="lead">'+r+'% evidence captured this session.</p>';
    }
    if(c.id==="compile"){
      html += '<div class="actions"><button class="btn primary" type="button" data-mode="compile">Open compile</button><a class="btn cyan" href="'+LIVE_OS+'" target="_blank" rel="noreferrer">Team Lead OS</a></div>'+
        '<p class="source">Live OS · hb-team-leader.netlify.app</p>';
    }
    if(c.id==="close"){
      html += '<div class="actions"><button class="btn primary" type="button" data-mode="compile">Compile record</button><a class="btn cyan" href="'+LIVE_OS+'" target="_blank" rel="noreferrer">Open Team Lead OS</a></div>';
    }
    html += '<p class="source">'+esc(c.source)+'</p>';
    return html;
  }

  function renderNav(){
    document.getElementById("side").innerHTML = CHAPTERS.map(function(c,i){
      var n = String(i+1).padStart(2,"0");
      return '<button type="button" class="nav-item'+(c.id===state.chapter?" on":"")+'" data-go="'+c.id+'"><span>'+n+'</span>'+esc(c.kicker)+'</button>';
    }).join("");
  }
  function renderCompile(){
    var p = document.getElementById("compilePanel");
    var show = state.mode==="compile";
    p.classList.toggle("show", show);
    if(!show) return;
    var r=Math.round(readiness()*100);
    p.innerHTML = '<div class="kicker">Compile payload</div><h2>Record the evidence.</h2>'+
      '<div class="field"><label>Candidate</label><input id="cand" value="'+esc(state.session.candidate)+'" /></div>'+
      '<div class="field"><label>Site / region</label><input id="site" value="'+esc(state.session.site)+'" /></div>'+
      '<div class="field"><label>Interviewer notes</label><textarea id="notes">'+esc(state.session.notes)+'</textarea></div>'+
      '<div class="kicker">Readiness '+r+'%</div><div class="bar"><i style="width:'+r+'%"></i></div>'+
      '<div class="actions">'+
      '<button class="btn primary" type="button" id="dlJson">JSON record</button>'+
      '<button class="btn" type="button" id="dlHtml">HTML report</button>'+
      '<button class="btn cyan" type="button" id="copyPay">Copy payload</button>'+
      '<a class="btn" href="'+LIVE_OS+'" target="_blank" rel="noreferrer">Open Team Lead OS</a>'+
      '<button class="btn" type="button" id="resetS">Reset session</button>'+
      '<button class="btn" type="button" data-mode="brief">Close</button></div>';
  }
  function payload(){
    return {
      kind:"hood-boss.team-lead.briefing-record",
      version:2,
      generatedAt:new Date().toISOString(),
      candidate:state.session.candidate||"UNNAMED",
      site:state.session.site||"",
      readiness:Math.round(readiness()*100),
      gates:state.session.gates,
      comms:state.session.comms,
      prep:state.session.prep,
      evidence:state.session.evidence,
      command:state.session.command,
      star:state.session.star,
      answers:state.session.answers,
      scores:state.session.scores,
      notes:state.session.notes,
      liveOs:LIVE_OS
    };
  }
  function reportHtml(){
    var s=state.session, r=Math.round(readiness()*100);
    var gates=GATES.map(function(g){return "<tr><td>"+esc(g[1])+"</td><td>"+(s.gates[g[0]]?"EVIDENCE":"OPEN")+"</td><td>"+esc(g[2])+"</td></tr>";}).join("");
    var answers=QS.map(function(q){
      var text=s.answers[q[0]]||"", sc=s.scores[q[0]];
      return "<section><h3>"+esc(q[1])+" — "+esc(q[2])+"</h3>"+(text?"<blockquote>"+esc(text)+"</blockquote>":"<p>No capture.</p>")+(sc!=null?"<p>"+sc+" · "+band(sc)+"</p>":"")+"</section>";
    }).join("");
    return "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"/><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/><title>Team Lead Briefing — "+esc(s.candidate||"Record")+"</title><style>body{margin:0;background:#05070a;color:#e8edf4;font:15px/1.55 IBM Plex Sans,system-ui,sans-serif}main{max-width:780px;margin:auto;padding:48px 24px}h1{color:#00ff87;font-family:Rajdhani,system-ui,sans-serif}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #1c2530;padding:8px 6px;text-align:left}blockquote{border-left:2px solid #00ff87;padding:8px 14px}</style></head><body><main><p>HOOD BOSS · TEAM LEAD BRIEFING</p><h1>Carry the standard.</h1><p>"+esc(s.candidate||"Unnamed")+" · "+esc(s.site||"no site")+" · readiness "+r+"%</p><h2>Readiness gates</h2><table>"+gates+"</table><h2>Hard story</h2><p>"+esc(s.star.where)+" / "+esc(s.star.who)+"</p><p>"+esc(s.star.what)+"</p><p>"+esc(s.star.action)+"</p><p>"+esc(s.star.lesson)+"</p><h2>Captured answers</h2>"+answers+"<p>Live OS: "+LIVE_OS+"</p></main></body></html>";
  }
  function download(name, text, type){
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain"}));
    a.download=name; a.click(); URL.revokeObjectURL(a.href);
  }

  function render(){
    var c=CHAPTERS[idx()];
    document.getElementById("slide").innerHTML = '<p class="kicker">'+esc(c.kicker)+'</p><h1>'+esc(c.title)+'</h1>'+bodyFor(c);
    document.getElementById("pos").textContent = String(idx()+1).padStart(2,"0")+" / "+String(CHAPTERS.length).padStart(2,"0");
    document.querySelectorAll(".modes button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-mode")===state.mode); });
    renderNav();
    renderCompile();
  }

  document.body.addEventListener("click", function(e){
    var t=e.target.closest("[data-mode],[data-go],[data-chip],#prev,#next,#enter,#burger,#dlJson,#dlHtml,#copyPay,#resetS");
    if(!t) return;
    if(t.id==="burger"){ document.getElementById("side").classList.toggle("open"); return; }
    if(t.id==="prev"){ go(-1); return; }
    if(t.id==="next"||t.id==="enter"){ go(1); return; }
    if(t.getAttribute("data-mode")){ state.mode=t.getAttribute("data-mode"); render(); return; }
    if(t.getAttribute("data-go")){ setChapter(t.getAttribute("data-go")); document.getElementById("side").classList.remove("open"); return; }
    var chip=t.getAttribute("data-chip");
    if(chip){
      if(state.chapter==="roadmap"){ setChapter(chip); return; }
      var bucket = state.chapter==="comms"?"comms":state.chapter==="prep"?"prep":state.chapter==="evidence"?"evidence":state.chapter==="command"?"command":state.chapter==="gates"?"gates":null;
      if(bucket){ state.session[bucket][chip]=!state.session[bucket][chip]; save(); render(); }
      return;
    }
    if(t.id==="dlJson"){ download("team-lead-briefing.json", JSON.stringify(payload(),null,2), "application/json"); return; }
    if(t.id==="dlHtml"){ download("team-lead-briefing-report.html", reportHtml(), "text/html"); return; }
    if(t.id==="copyPay"){ navigator.clipboard.writeText(JSON.stringify(payload(),null,2)); t.textContent="Copied"; return; }
    if(t.id==="resetS"){ state.session=empty(); save(); render(); }
  });
  document.body.addEventListener("input", function(e){
    var el=e.target;
    if(el.id==="cand"){ state.session.candidate=el.value; save(); return; }
    if(el.id==="site"){ state.session.site=el.value; save(); return; }
    if(el.id==="notes"){ state.session.notes=el.value; save(); return; }
    if(el.getAttribute("data-star")){ state.session.star[el.getAttribute("data-star")]=el.value; save(); return; }
    if(el.getAttribute("data-ans")){
      var id=el.getAttribute("data-ans");
      state.session.answers[id]=el.value;
      state.session.scores[id]=scoreAnswer(el.value);
      save();
    }
  });
  document.addEventListener("keydown", function(e){
    var tag=(e.target&&e.target.tagName)||"";
    if(tag==="INPUT"||tag==="TEXTAREA") return;
    if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); go(1); }
    if(e.key==="ArrowLeft"){ e.preventDefault(); go(-1); }
    if(e.key==="d"||e.key==="D"){ state.mode="drill"; render(); }
    if(e.key==="c"||e.key==="C"){ state.mode="compile"; render(); }
    if(e.key==="b"||e.key==="B"){ state.mode="brief"; render(); }
  });

  var cv=document.getElementById("viz"), ctx=cv.getContext("2d"), particles=[];
  function resize(){ cv.width=cv.clientWidth; cv.height=cv.clientHeight; }
  window.addEventListener("resize", resize); resize();
  for(var i=0;i<42;i++) particles.push({x:Math.random(),y:Math.random(),vx:(Math.random()-0.5)*0.0006,vy:(Math.random()-0.5)*0.0004,h:150+Math.random()*40});
  (function tick(){
    var w=cv.width,h=cv.height;
    ctx.fillStyle="rgba(5,7,10,0.18)"; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle="rgba(0,255,135,0.08)";
    particles.forEach(function(p,i){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>1) p.vx*=-1;
      if(p.y<0||p.y>1) p.vy*=-1;
      var x=p.x*w, y=p.y*h;
      ctx.beginPath(); ctx.arc(x,y,1.6,0,Math.PI*2);
      ctx.fillStyle="hsla("+p.h+",100%,62%,0.7)"; ctx.fill();
      var q=particles[(i+7)%particles.length];
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(q.x*w,q.y*h); ctx.stroke();
    });
    requestAnimationFrame(tick);
  })();

  render();
})();
</script>
</body>
</html>
